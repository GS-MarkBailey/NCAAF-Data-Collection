name: Publish Confluence

on:
  push:
    branches: [main]
    paths:
      - 'docs/confluence-weekly-build-in-public.md'
      - 'docs/ui-snapshots/**'
      - 'scripts/publish-confluence-page.mjs'
      - 'scripts/markdown-to-confluence-storage.mjs'
      - 'scripts/confluence-*.mjs'
      - 'scripts/stage-confluence-attachments.mjs'
      - 'scripts/sync-confluence-snapshots.mjs'
      - 'scripts/ui-snapshot-*.mjs'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish to Confluence
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_PAGE_ID: ${{ secrets.CONFLUENCE_PAGE_ID }}
        run: |
          if [ -z "${CONFLUENCE_API_TOKEN:-}" ]; then
            echo "Confluence secrets not configured — skipping publish."
            echo "Add CONFLUENCE_* repository secrets to enable auto-publish on push."
            exit 0
          fi
          npm run publish:confluence
