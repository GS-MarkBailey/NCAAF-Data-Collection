name: UI snapshots

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capture mode
        required: true
        default: production
        type: choice
        options:
          - production
          - milestones
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/capture-ui-snapshots.mjs'
      - '.github/workflows/ui-snapshots.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Capture production snapshots
        if: github.event_name == 'push' || inputs.mode == 'production'
        run: |
          LABEL="deploy-${GITHUB_SHA::7}"
          npm run capture:snapshots -- \
            --url https://ncaaf-data-collection.vercel.app \
            --label "$LABEL"

      - name: Capture weekly milestones
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'milestones'
        run: npm run capture:snapshots -- --milestones

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots-${{ github.run_id }}
          path: docs/ui-snapshots/
          retention-days: 90
