name: Build in public sync

# Fully automated: src change → capture → commit docs → publish Confluence.
# Requires CONFLUENCE_* repository secrets (see docs/ui-snapshots/README.md).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/confluence-weekly-build-in-public.md'
      - 'docs/ui-snapshots/**'
      - 'scripts/capture-ui-snapshots.mjs'
      - 'scripts/sync-confluence-snapshots.mjs'
      - 'scripts/ui-snapshot-*.mjs'
      - 'scripts/ui-snapshot-doc-content.mjs'
      - 'scripts/publish-confluence-page.mjs'
      - 'scripts/confluence-*.mjs'
      - 'scripts/markdown-to-confluence-storage.mjs'
      - 'scripts/stage-confluence-attachments.mjs'
      - '.github/workflows/build-in-public-sync.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: current-week
        type: choice
        options:
          - current-week
          - milestones
          - publish-only

concurrency:
  group: build-in-public-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            src:
              - 'src/**'
              - 'scripts/capture-ui-snapshots.mjs'
            snapshot_config:
              - 'scripts/ui-snapshot-*.mjs'
              - 'scripts/ui-snapshot-doc-content.mjs'
              - 'scripts/sync-confluence-snapshots.mjs'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: >-
          steps.changes.outputs.src == 'true'
          || (github.event_name == 'workflow_dispatch'
          && (inputs.mode == 'current-week' || inputs.mode == 'milestones'))
        run: npx playwright install chromium

      - name: Capture current week
        if: >-
          steps.changes.outputs.src == 'true'
          || (github.event_name == 'workflow_dispatch' && inputs.mode == 'current-week')
        run: npm run capture:current-week

      - name: Capture all milestones
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'milestones'
        run: npm run capture:and-sync

      - name: Regenerate Confluence markdown (config-only)
        if: >-
          steps.changes.outputs.snapshot_config == 'true'
          && steps.changes.outputs.src != 'true'
          && !(github.event_name == 'workflow_dispatch'
          && (inputs.mode == 'current-week' || inputs.mode == 'milestones'))
        run: npm run sync:confluence-doc

      - name: Commit doc updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No doc changes to commit."
          else
            git commit -m "chore: sync UI snapshots and Confluence doc [skip ci]"
            git push
          fi

      - name: Publish to Confluence
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_PAGE_ID: ${{ secrets.CONFLUENCE_PAGE_ID }}
        run: |
          if [ -z "${CONFLUENCE_API_TOKEN:-}" ]; then
            echo "::warning::Confluence secrets not configured — skipping publish."
            echo "Add CONFLUENCE_* repository secrets to auto-update Confluence."
            exit 0
          fi
          npm run publish:confluence
